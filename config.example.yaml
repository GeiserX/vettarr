# config.yaml: everything the app does is set here. The full contract is
# docs/CONFIG.md.
#
# - A part of the app starts only when its block exists. An integration with
#   `enabled: false` stays off. This file, as shipped, starts the web UI and
#   the policy in shadow mode, and nothing else.
# - Any string may hold ${VAR}; it is read from the environment at start.
#   Keep every secret that way. A ${VAR} that is not set stops the start and
#   names the variable. A block with `enabled: false` is not expanded.
# - `config check` validates this file and lists what would start.
# - CONFIG_READONLY=1 stops the app from ever writing this file.

# --- Dry run -------------------------------------------------------------------
# true: nothing outside this database is changed, whoever clicks what. Every
# add, delete, request, message, reaction, thank and keep-alive becomes a
# would_have event instead, and the item moves on as if it had happened.
# DRY_RUN=1 in the environment turns it on whatever this line says.
dry_run: false

# --- Telegram -----------------------------------------------------------------
# Needed by userbot and bot sources. api_id and api_hash come from
# https://my.telegram.org; the bot token from @BotFather.
#
# telegram:
#   api_id: ${TELEGRAM_API_ID}
#   api_hash: ${TELEGRAM_API_HASH}
#   phone: ${TELEGRAM_PHONE}          # only asked for when the session logs in again
#   session_path: /data/sessions/vettarr
#   bot_token: ${TELEGRAM_BOT_TOKEN}
#   reviewers: [123456789]            # Telegram user ids allowed to decide

# --- Sources: where posts come from -----------------------------------------
# userbot: reads a group or channel as your account; the only kind that can
#          read history (backfill: off | since_last | full).
# bot:     the bot receives messages in a group, a channel, or `chat: private`
#          for direct messages. A bot cannot read history.
# seerr:   Seerr's pending requests, decided by the policy and approved or
#          declined in Seerr (needs integrations.seerr and integrations.tmdb).
#          docs/CONFIG.md "Seerr requests" says what to paste in Seerr.
# on_download / on_reject: delete | react | none. Default none: the app never
# touches a post unless you say so.
sources: []
#   - key: films
#     kind: userbot
#     chat: -1001234567890
#     backfill: since_last
#     formats: [card, scene]
#     on_download: none
#     on_reject: none
#   - key: inbox
#     kind: bot
#     chat: private
#     allowed_senders: reviewers      # reviewers | anyone | [user ids]
#     direct_adds: reviewers          # whose .torrent or magnet is added as it is:
#                                     # reviewers | anyone | off
#     on_download: react
#     notify_on_review: true
#   - key: requests
#     kind: seerr
#     webhook_secret: ${SEERR_WEBHOOK_SECRET}   # Seerr's Authorization Header; at least
#                                     # 16 characters. Seerr posts to /hooks/seerr/requests
#     poll_minutes: 5                 # the pending list is read this often as well
#     allowed_senders: anyone         # anyone | [Seerr user ids]

# --- Formats: how a post is read --------------------------------------------
# Word lists, not code. Words match case-insensitively, anywhere in the post,
# and a space matches any run of whitespace. A word between slashes is a
# regular expression: '/Films?\s*WEB/'. Copy a profile and swap the words for
# the ones your group writes. A post is tried against its source's formats in
# order; the first that reads a title and a type wins. Quality, source, size,
# group, SxxEyy, (YYYY) and [PACK] are read by the app for every format.
formats:
  # A card: labelled lines, for example
  #   NEW MOVIE
  #   Title: Some Film
  #   Year: 2024
  #   Type: Movie - 1080p - WEB-DL - 4.2 GB
  #   Link: https://tracker-a.example/details.php?id=42
  - key: card
    kind: card
    type_headers:                     # one of these in the post decides the type
      ebook: [NEW EBOOK, NEW BOOK]
      audiobook: [NEW AUDIOBOOK]
      magazine: [NEW MAGAZINE]
      comic: [NEW COMIC, NEW MANGA]
      music: [NEW ALBUM, NEW MUSIC]
    type_hints:                       # weaker: suggest a type anywhere in the post
      movie: [NEW MOVIE]
      series: [NEW SERIES]
    # Category names in a header or Type line. One that opens a line and is
    # followed by a dash or an arrow ("Movies -> WEB-DL") also hints the type;
    # inside a title ("Some Show - 1998") it hints nothing.
    category_words:
      movie: [Movie, Movies, Film]
      series: [Series, Show]
    fields:
      title: [Title]
      link: [Link]
      year: [Year]
      type: [Type]                    # Type: <category> - <quality> - <source> - <size>
    ignore_hosts: [instagram.com, tiktok.com, youtube.com, youtu.be, x.com, twitter.com, facebook.com]
    # Whole words that name a kind of media. A message with no card in it that
    # holds one ("can someone find that film") is kept for review, not ignored.
    media_words: [film, films, movie, movies, series, season, episode, book, books, audiobook, magazine, comic, album]

  # A scene release name on the first line:
  #   Some.Film.2024.1080p.WEB-DL.x264-GROUP
  - key: scene
    kind: scene

# --- Providers: trackers you have an account on ------------------------------
# Uncomment the block for your tracker's software and fill in your own host.
# `links` turns a details link in a post into the exact torrent, no search.
# Every link pattern carries examples; `config check` proves each one.
# Credentials are only ever sent to base_url's host and its aliases, compared
# exactly: a subdomain is another host. `search` names the tracker's software:
# the direct search after Prowlarr finds nothing, and the login form
# `auth.from: login` fills in.
# thank and keep_alive are off unless you turn them on. Some trackers forbid
# automation; read their rules first.
providers: []
