# --- Integrations: services you run ------------------------------------------
# Turn one on with `enabled: true` once its variables are set.
integrations:
  prowlarr:
    enabled: false
    url: http://prowlarr:9696
    api_key: ${PROWLARR_API_KEY}
    # Prowlarr category ids sent with a search. A type not listed sends its
    # standard Newznab category (movie 2000, series 5000, audiobook 3030,
    # ebook 7020, magazine 7010, comic 7030, music 3000); [] searches all.
    categories:
      movie: [2000]
      series: [5000]
      ebook: [7000]
  qbittorrent:
    enabled: false
    url: http://qbittorrent:8080
    username: admin
    password: ${QBITTORRENT_PASSWORD}
    # Per media type. A type not listed is added with no category, and saved
    # where its category (or qBittorrent's default) saves.
    categories:
      movie: movies
      series: tv
      ebook: books
    save_paths: {}
  radarr:
    enabled: false
    url: http://radarr:7878
    api_key: ${RADARR_API_KEY}
    root_folder: /movies
    quality_profile: HD-1080p
  sonarr:
    enabled: false
    url: http://sonarr:8989
    api_key: ${SONARR_API_KEY}
    root_folder: /tv
    quality_profile: HD-1080p
  seerr:
    enabled: false
    url: http://seerr:5055
    api_key: ${SEERR_API_KEY}
    user_id: 2                        # requests are made as this Seerr user
  tmdb:
    enabled: false
    api_key: ${TMDB_API_KEY}
    language: en-US
  # The parents guide (violence, nudity, ...) comes from IMDb's undocumented
  # website API. IMDb's terms forbid automated use without its consent: this
  # is for a private, single-user instance, at your own risk, and it can stop
  # working without notice. It needs no key and runs only while a rule reads
  # an imdb.* signal. A severity voted by fewer than min_votes people counts
  # as missing.
  imdb_guide:
    enabled: true
    min_votes: 20
  google_books:
    enabled: false
    api_key: ${GOOGLE_BOOKS_API_KEY}
  jellyfin:
    enabled: false
    url: http://jellyfin:8096
    api_key: ${JELLYFIN_API_KEY}

# --- Delivery: where an approved item goes, per media type -------------------
# qbittorrent | radarr (movie) | sonarr (series) | seerr (movie, series) | none.
# The target's integration must be on. List every type you receive (movie,
# series, audiobook, ebook, magazine, comic, music): a type not listed here is
# not delivered, and an approved item of that type comes back to you. `config
# check` and the start of the app warn about the types left out.
deliver: {}
# The download client: the post's own torrent, the one it links to, or the
# best release of the search.
#   movie: qbittorrent
#   series: qbittorrent
#   ebook: qbittorrent
# Radarr and Sonarr add the title and search for it themselves (they need
# root_folder and quality_profile above). A .torrent, a magnet or a linked
# torrent in the post is not used: the item is delivered by title.
#   movie: radarr
#   series: sonarr
# Seerr gets a request, made as integrations.seerr.user_id.
#   movie: seerr
#   series: seerr
# Decide and record only: nothing is fetched or added.
#   music: none
#   ebook: qbittorrent

# --- Policy: what downloads by itself ---------------------------------------
# auto_approve: off (every item waits for you) | shadow (decides and records,
# acts on nothing) | on.
# A rule checks one signal with one operator against one value and says what
# happens when it hits: approve | review | reject | notify. Reject never
# deletes the post. Signals and operators: docs/CONFIG.md.
policy:
  auto_approve: shadow
  types:
    movie:
      mode: rules                     # rules | always | never
      when_data_missing: wait         # wait | review | approve
      max_wait_hours: 24
    series:
      mode: rules
      when_data_missing: wait
      max_wait_hours: 24
    magazine:
      mode: always
    ebook:
      mode: never
    audiobook:
      mode: never
    comic:
      mode: never
    music:
      mode: never
  lists: {}
  #   unwanted: [some keyword, another keyword]
  rules:
    - id: not-released
      name: Not out anywhere yet           # no viewers yet to rate it
      check: released
      is: false
      on_hit: review
      when_missing: review            # TMDB lists no release date: a person decides
    - id: violence
      name: Violence is severe
      check: imdb.violence
      at_least: severe
      split_vote: 0.40                # also hits when 40% of votes are at or above
      on_hit: review
      # when_missing: approve         # no votes yet: approve; default: the type's when_data_missing
    - id: nudity
      name: Nudity is moderate or more
      check: imdb.nudity
      at_least: moderate
      split_vote: 0.40
      on_hit: review
    - id: frightening
      name: Frightening is severe
      check: imdb.frightening
      at_least: severe
      split_vote: 0.40
      on_hit: review
    - id: adult-certification
      name: Rated for adults only
      check: certification            # COUNTRY:rating; add your own country
      any_of: [US:NC-17, US:X, GB:R18, GB:18]
      on_hit: review
    # - id: unwanted-keywords
    #   check: keyword
    #   matches_any: unwanted
    #   on_hit: reject
    # A rule can combine checks with all, any and not, nested as deep as needed:
    # - id: old-and-rough
    #   name: Pre-2000 films with rough content
    #   all:
    #     - check: year
    #       at_most: 1999
    #     - any:
    #         - check: imdb.violence
    #           at_least: moderate
    #           split_vote: 0.40
    #         - check: imdb.nudity
    #           at_least: moderate
    #   on_hit: review
  # Scopes: a different policy for some sources or senders. The first scope
  # whose `when` holds decides the item; `when` reads source, sender,
  # time_window or post_age_hours. `types` changes only the fields it gives,
  # `rules` run before the rules above, `skip` leaves rules above out.
  # scopes:
  #   - id: kids
  #     name: The kids' Seerr accounts
  #     when:
  #       all:
  #         - {check: source, any_of: [seerr]}
  #         - {check: sender, any_of: [17, 23]}
  #     types:
  #       movie: {when_data_missing: review}
  #     rules:
  #       - id: kids-rating
  #         check: certification
  #         at_least: US:PG-13
  #         on_hit: reject
  #     skip: [nudity]

# --- Release words: how a post names a language, subtitles, a whole season ----
# Read by the audio_language, subtitles and season_complete signals. These are
# the defaults, in English. A list you write replaces its default whole, so
# add your group's words to the English ones. Same word rules as formats.
release_words:
  languages:                          # language code: the words that name it
    es: [spanish, spa, esp]
    en: [english, eng]
    fr: [french, truefrench, vff, vfq]
    de: [german, ger]
    it: [italian, ita]
    pt: [portuguese]
    ja: [japanese, jap, jpn]
    ko: [korean, kor]
    ca: [catalan]
  subtitles: [sub, subs, subtitle, subtitles]   # "Subs: English, French"
  subtitle_tags: {}                   # a tag that alone means subtitled: {en: [subbed]}
  full_season: [complete, '/\bseason\s+\d+\b/']   # [PACK] and a bare S01 always count
  # A bracket of these alone is left out of a book's title: "(MP3)", "[EPUB, PDF]".
  format_tags: [mp3, m4a, m4b, epub, pdf, mobi, azw, azw3, cbr, cbz]

# --- Notifications -----------------------------------------------------------
# An Apprise API /notify endpoint or a plain http(s) webhook; gets each
# decision, each item that needs you, and tracker session changes, as JSON.
# notify:
#   url: ${NOTIFY_URL}

