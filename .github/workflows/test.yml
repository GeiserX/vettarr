name: Tests

# The tracker guard is only worth anything if it keeps working, so the suite
# runs on every pull request and on main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 is the floor pyproject.toml declares; 3.14 is what the image runs.
        python: ["3.12", "3.14"]
    name: unittest (${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.15"
          enable-cache: false

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install the project
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e .

      - name: Tests
        run: .venv/bin/python -m unittest discover -s tests -v

  # The image is built only on a tag, so a Dockerfile change could reach a
  # release untested: the python:3.14 bump (PR 1) kept a 3.12 path and the
  # v1.0.1 build failed. This builds it on every PR, for amd64, and pushes nothing.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
