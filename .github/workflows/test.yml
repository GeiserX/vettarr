name: Tests

# The tracker guard is only worth anything if it keeps working, so the suite
# runs on every pull request and on main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.15"
          enable-cache: false

      - name: Install Python
        run: uv python install 3.12

      - name: Install the project
        run: |
          uv venv --python 3.12
          uv pip install -e .

      - name: Tests
        run: .venv/bin/python -m unittest discover -s tests -v
