<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C62828"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8A80;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FF8A80;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="white" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
  </g>

  <!-- Film frame icon (left side) -->
  <g transform="translate(60, 50)">
    <!-- Film frame outer -->
    <rect x="0" y="0" width="90" height="100" rx="6" fill="none" stroke="white" stroke-width="2.5" opacity="0.9"/>
    <!-- Sprocket holes left -->
    <rect x="-4" y="10" width="10" height="8" rx="2" fill="white" opacity="0.5"/>
    <rect x="-4" y="28" width="10" height="8" rx="2" fill="white" opacity="0.5"/>
    <rect x="-4" y="46" width="10" height="8" rx="2" fill="white" opacity="0.5"/>
    <rect x="-4" y="64" width="10" height="8" rx="2" fill="white" opacity="0.5"/>
    <rect x="-4" y="82" width="10" height="8" rx="2" fill="white" opacity="0.5"/>
    <!-- Sprocket holes right -->
    <rect x="84" y="10" width="10" height="8" rx="2" fill="white" opacity="0.5"/>
    <rect x="84" y="28" width="10" height="8" rx="2" fill="white" opacity="0.5"/>
    <rect x="84" y="46" width="10" height="8" rx="2" fill="white" opacity="0.5"/>
    <rect x="84" y="64" width="10" height="8" rx="2" fill="white" opacity="0.5"/>
    <rect x="84" y="82" width="10" height="8" rx="2" fill="white" opacity="0.5"/>
    <!-- Inner frame -->
    <rect x="14" y="14" width="62" height="44" rx="3" fill="white" opacity="0.1" stroke="white" stroke-width="1" stroke-opacity="0.3"/>
    <!-- Checkmark inside frame -->
    <polyline points="28,38 40,50 66,24" fill="none" stroke="#4CAF50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Triage line -->
    <line x1="14" y1="72" x2="76" y2="72" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <line x1="14" y1="84" x2="56" y2="84" stroke="white" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Title text -->
  <text x="200" y="105" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="bold" fill="white">vettarr</text>

  <!-- Subtitle text -->
  <text x="202" y="135" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="white" opacity="0.75">Your rules decide what gets downloaded</text>

  <!-- Decorative elements (right side) -->
  <g transform="translate(740, 30)" opacity="0.15">
    <circle cx="40" cy="30" r="20" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="40" cy="30" r="8" fill="white"/>
    <rect x="80" y="20" width="50" height="3" rx="1.5" fill="white"/>
    <rect x="80" y="32" width="35" height="3" rx="1.5" fill="white"/>
    <rect x="80" y="44" width="45" height="3" rx="1.5" fill="white"/>
  </g>
  <g transform="translate(720, 110)" opacity="0.1">
    <rect x="0" y="0" width="140" height="60" rx="6" fill="none" stroke="white" stroke-width="1.5"/>
    <line x1="0" y1="20" x2="140" y2="20" stroke="white" stroke-width="1"/>
    <rect x="10" y="30" width="50" height="6" rx="3" fill="white"/>
    <rect x="10" y="44" width="35" height="6" rx="3" fill="white"/>
    <circle cx="120" cy="40" r="10" fill="none" stroke="white" stroke-width="1.5"/>
    <polyline points="115,40 118,43 125,36" fill="none" stroke="white" stroke-width="1.5"/>
  </g>
</svg>
