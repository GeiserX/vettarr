[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vettarr"
version = "1.0.3"
description = "Send a link, a post, a magnet, a torrent or a Seerr request; your rules decide what gets downloaded"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.37.0",
    "cryptg>=0.4",
    "python-telegram-bot>=22.0",
    "fastapi>=0.133.0",
    # 1.7.0 is the first to check the Host header before building request.url from it.
    "starlette>=1.7.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-multipart>=0.0.9",
    "pydantic>=2",
    "ruamel.yaml>=0.18",
]

[project.scripts]
vettarr = "vettarr.__main__:main"
# The name before the rename, so a compose file that still runs it keeps working.
media-triage = "vettarr.__main__:legacy_main"

[tool.hatch.build.targets.wheel]
packages = ["src/vettarr"]
# Built by scripts/build-css.sh and ignored by git, so it has to be named.
artifacts = ["src/vettarr/web/static/app.css"]

[tool.hatch.build.targets.wheel.force-include]
"config.example.yaml" = "vettarr/config/config.example.yaml"
